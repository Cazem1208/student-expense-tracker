<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Student Expense Tracker</h1>
        <p>Track your daily spending easily.</p>
    </header>

    <main>

        <!-- Total Spent -->
        <section class="summary">
            <h2>Total Spent</h2>
            <p id="total-amount">RM 0.00</p>
        </section>

        <!-- Add Expense Form -->
        <section class="expense-form-section">
            <h2>Add Expense</h2>

            <form id="expense-form">

                <div class="form-group">
                    <label for="expense-name">Expense Name</label>
                    <input
                        type="text"
                        id="expense-name"
                        placeholder="e.g. Lunch"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="expense-amount">Amount (RM)</label>
                    <input
                        type="number"
                        id="expense-amount"
                        placeholder="e.g. 12.50"
                        step="0.01"
                        min="0"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="expense-category">Category</label>
                    <select id="expense-category" required>
                        <option value="">Select category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Education">Education</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="expense-date">Date</label>
                    <input
                        type="date"
                        id="expense-date"
                        required
                    >
                </div>

                <button type="submit">Add Expense</button>

            </form>
        </section>

        <!-- Filter -->
        <section class="filter-section">
            <h2>Expenses</h2>

            <label for="category-filter">Filter by Category:</label>

            <select id="category-filter">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Education">Education</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
            </select>
        </section>

        <!-- Expense List -->
        <section class="expense-list-section">

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Amount</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="expense-list">
                    <!-- Expenses will be added here by JavaScript -->
                </tbody>
            </table>

            <p id="no-expenses">No expenses added yet.</p>

        </section>

    </main>

    <script src="js/script.js"></script>

</body>
</html>
